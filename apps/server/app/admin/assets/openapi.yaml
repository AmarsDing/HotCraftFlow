                    type: string
                    description: 最近命中时间
                    format: date-time
                createBy:
                    type: integer
                    description: 创建者ID
                    format: uint32
                updateBy:
                    type: integer
                    description: 更新者ID
                    format: uint32
                createTime:
                    type: string
                    description: 创建时间
                    format: date-time
                updateTime:
                    type: string
                    description: 更新时间
                    format: date-time
                deleteTime:
                    type: string
                    description: 删除时间
