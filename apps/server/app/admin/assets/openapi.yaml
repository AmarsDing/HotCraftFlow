      description: 通知消息分类管理服务
    - name: NotificationMessageRecipientService
      description: 通知消息接收者管理服务
    - name: NotificationMessageService
      description: 通知消息管理服务
    - name: OrganizationService
      description: 组织管理服务
    - name: OssService
      description: OSS服务
    - name: PositionService
      description: 职位管理服务
    - name: PrivateMessageService
      description: 私信消息管理服务
    - name: RadarConfigService
      description: RadarConfigService 雷达用户配置（勿与平台 UserService 重名）
    - name: RadarNotifyService
      description: RadarNotifyService 雷达通知（勿与平台 NotifyService 重名）
    - name: RepoService
      description: RepoService 仓库详情 / 源码 / 克隆 / AI 总结
    - name: ResourceGroupService
      description: |-
        资源组只读服务（resource_groups 表）。
