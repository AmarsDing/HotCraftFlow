                    format: enum
                targetValue:
                    type: string
                    description: 限制目标值（IP地址或用户名，按 target_type 解释）
                action:
                    type: integer
                    description: 动作（BLOCK阻断/ALLOW放行）
                    format: enum
                reason:
                    type: string
                    description: 限制原因
                status:
                    type: string
                    description: 启停状态（ON启用/OFF禁用），缺省 ON；禁用规则不参与登录判定
                expireTime:
                    type: string
                    description: 过期时间（可空=永久有效）；过期规则不参与登录判定
                    format: date-time
                hitCount:
                    type: string
                    description: 命中次数（登录判定命中时异步累加，统计用途）
