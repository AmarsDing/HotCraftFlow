    - name: MapService
      description: "MapService ⑤ MAP 媒体自动化发布矩阵 REST API（概要设计 §8.2 路由矩阵）。\n\n \U0001F534 三条红线（必须体现在 API 形状上）：\n  1. approve 与 publish 是两个独立 rpc，绝不一键发布（ADR-MAP-03）；\n  2. approve/reject 由服务端从 JWT 取审批人，禁自批（请求体不含 approver 字段，防伪造）；\n  3. visibility 默认恒 private；非 private 必须带 override_reason（NFR-MAP-01）。\n\n 所有 {id} 均为业务字符串 ID（du_/pa_/pr_ 前缀 ULID），非内部整型主键。"
    - name: MappingService
      description: MappingService 映射表 CRUD + CSV 导入导出。
    - name: MediaDoctorService
    - name: MediaEnginesService
    - name: MediaJobsService
    - name: MenuService
