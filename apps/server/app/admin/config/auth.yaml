auth:
  authn:
    type: "jwt" # jwt, oidc, preshared_key

    jwt:
      method: "HS256" # HS256, HS384, HS512, RS256, RS384, RS512, ES256, ES384, ES512, Ed25519
      # 本地 dev 约定的占位密钥，投产前必须收敛（替换为强随机密钥并走密钥管理/环境注入）。
      key: "CHANGE_ME_DEV_JWT_SECRET"  # placeholder; replace before production

    oidc:
      issuer_url: "https://example.com"
      audience: "your_audience"
      method: "HS256"

    preshared_key:
      valid_keys:
        - "key1"
        - "key2"

  authz:
    # 仅支持 noop / casbin（见 authorizer.go）；opa/zanzibar 未实现，
    # 配置未实现类型会按 noop 放行并输出 [SECURITY] 错误日志（等于全站放行，勿用）。
    # casbin 走"角色直绑 API 资源"策略：seed 时 super 角色自动绑定全部 API 资源。
    type: "casbin" # noop | casbin
