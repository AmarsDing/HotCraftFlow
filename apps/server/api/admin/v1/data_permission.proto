syntax = "proto3";

package admin.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 数据权限规则服务
// 按 role_id 配置数据范围（all/dept/custom/self），scope=custom 时通过 ap_org_role_dept 配置具体部门。
service DataPermissionService {
  // 查询数据权限规则列表
  rpc List (pagination.PagingRequest) returns (ListDataPermissionResponse) {
    option (google.api.http) = {
      get: "/api/v1/monitor/data_permissions"
    };
  }

  // 查询数据权限规则详情
  rpc Get (GetDataPermissionRequest) returns (DataPermission) {
    option (google.api.http) = {
      get: "/api/v1/monitor/data_permissions/{id}"
    };
  }

  // 创建数据权限规则
  rpc Create (CreateDataPermissionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/monitor/data_permissions"
      body: "*"
    };
  }

  // 更新数据权限规则
  rpc Update (UpdateDataPermissionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/monitor/data_permissions/{id}"
      body: "*"
    };
  }

  // 删除数据权限规则
  rpc Delete (DeleteDataPermissionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/monitor/data_permissions/{id}"
    };
  }
}

// 数据权限规则
message DataPermission {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "规则ID"
    }
  ]; // 规则ID

  optional uint32 role_id = 2 [
    json_name = "roleId",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      description: "角色ID"
    }
  ]; // 角色ID

  optional string name = 3 [
    json_name = "name",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      description: "规则名称"
    }
  ]; // 规则名称

  optional string field = 4 [
    json_name = "field",
    (gnostic.openapi.v3.property) = {
      description: "数据字段名（如 dept_id、user_id）"
    }
  ]; // 数据字段名

  optional string scope = 5 [
    json_name = "scope",
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {
      description: "范围：all/dept/custom/self"
      default: {string: "self"}
      enum: [{yaml: "all"}, {yaml: "dept"}, {yaml: "custom"}, {yaml: "self"}]
    }
  ]; // 范围

  optional string rule_json = 6 [
    json_name = "ruleJson",
    (gnostic.openapi.v3.property) = {
      description: "自定义规则JSON（scope=custom 时配合 ap_org_role_dept 使用）"
    }
  ]; // 自定义规则JSON

  optional string status = 7 [
    json_name = "status",
    (gnostic.openapi.v3.property) = {
      description: "状态：ON-启用，OFF-禁用"
      default: {string: "ON"}
      enum: [{yaml: "ON"}, {yaml: "OFF"}]
    }
  ]; // 状态

  optional uint32 tenant_id = 8 [json_name = "tenantId", (gnostic.openapi.v3.property) = {description: "租户ID"}]; // 租户ID

  optional uint32 create_by = 100 [json_name = "createBy", (gnostic.openapi.v3.property) = {description: "创建者ID"}]; // 创建者ID
  optional uint32 update_by = 101 [json_name = "updateBy", (gnostic.openapi.v3.property) = {description: "更新者ID"}]; // 更新者ID

  optional google.protobuf.Timestamp create_time = 200 [json_name = "createTime", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp update_time = 201 [json_name = "updateTime", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
}

// 查询数据权限规则列表 - 回应
message ListDataPermissionResponse {
  repeated DataPermission items = 1;
  uint32 total = 2;
}

// 查询数据权限规则详情 - 请求
message GetDataPermissionRequest {
  uint32 id = 1;
}

// 创建数据权限规则 - 请求
message CreateDataPermissionRequest {
  DataPermission data = 1;
}

// 更新数据权限规则 - 请求
message UpdateDataPermissionRequest {
  DataPermission data = 1;

  google.protobuf.FieldMask update_mask = 2 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,name,scope"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 3 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。

  uint32 id = 4 [json_name = "id", (gnostic.openapi.v3.property) = {description: "要更新的规则ID（URL 路径参数）"}]; // 要更新的规则ID
}

// 删除数据权限规则 - 请求
message DeleteDataPermissionRequest {
  uint32 id = 1;
}
