syntax = "proto3";

package admin.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";

import "pagination/v1/pagination.proto";

// 调度任务管理服务
service TaskService {
  // 查询调度任务列表
  rpc List (pagination.PagingRequest) returns (ListTaskResponse) {
    option (google.api.http) = {
      get: "/api/v1/monitor/tasks"
    };
  }

  // 查询调度任务详情
  rpc Get (GetTaskRequest) returns (Task) {
    option (google.api.http) = {
      get: "/api/v1/monitor/tasks/{id}"
    };
  }

  // 创建调度任务
  rpc Create (CreateTaskRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/monitor/tasks"
      body: "*"
    };
  }

  // 更新调度任务
  rpc Update (UpdateTaskRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/v1/monitor/tasks/{id}"
      body: "*"
    };
  }

  // 删除调度任务
  rpc Delete (DeleteTaskRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/monitor/tasks/{id}"
    };
  }

  rpc GetTaskByTypeName (GetTaskByTypeNameRequest) returns (Task) {}

  // 重启所有的调度任务
  rpc RestartAllTask (google.protobuf.Empty) returns (RestartAllTaskResponse) {
    option (google.api.http) = {
      post: "/api/v1/monitor/tasks:restart"
      body: "*"
    };
  }

  // 停止所有的调度任务
  rpc StopAllTask (google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/monitor/tasks:stop"
      body: "*"
    };
  }

  // 控制调度任务
  rpc ControlTask (ControlTaskRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/monitor/tasks:control"
      body: "*"
    };
  }

  // 查询已注册任务处理器清单（前端 typeName 下拉数据源；与 biz 白名单同源）
  rpc ListTaskHandlers (google.protobuf.Empty) returns (ListTaskHandlersResponse) {
    option (google.api.http) = {
      get: "/api/v1/monitor/task-handlers"
    };
  }

  // 查询任务执行记录（最近 50 条，按执行时间倒序）
  rpc ListTaskExecutions (GetTaskRequest) returns (ListTaskExecutionsResponse) {
    option (google.api.http) = {
      get: "/api/v1/monitor/tasks/{id}/executions"
    };
  }

  // 立即执行一次任务（一次性入队，不影响既有周期调度；禁用状态也可手动触发）
  rpc RunTask (RunTaskRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/monitor/tasks/{id}:run"
      body: "*"
    };
  }
}

// 调度任务类型
enum TaskType {
  PERIODIC = 0;    // 周期性任务
  DELAY = 1;       // 延时任务
  WAIT_RESULT = 2;  // 等待结果
}

// 任务选项
message TaskOption {
  optional uint32 retry_count = 1 [
    json_name = "retryCount",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "任务最多可以重试的次数"
    }
  ]; // 任务最多可以重试的次数

  optional google.protobuf.Duration timeout = 2 [
    json_name = "timeout",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "任务超时时间"
    }
  ]; // 任务超时时间

  optional google.protobuf.Timestamp deadline = 3 [
    json_name = "deadline",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "任务截止时间"
    }
  ]; // 任务截止时间

  optional google.protobuf.Duration process_in = 4 [
    json_name = "processIn",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "任务延迟处理时间"
    }
  ]; // 任务延迟处理时间

  optional google.protobuf.Timestamp process_at = 5 [
    json_name = "processAt",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "任务执行时间点"
    }
  ]; // 任务执行时间点
}

// 调度任务
message Task {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "任务ID"
    }
  ]; // 任务ID

  optional TaskType type = 2 [
    json_name = "type",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "任务类型"
    }
  ]; // 任务类型

  optional string type_name = 3 [
    json_name = "typeName",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "任务执行类型名，例如 \"send_email\"、\"generate_report\" 等，用于区分不同类型的任务"
    }
  ]; // 任务执行类型名

  optional string task_payload = 4 [
    json_name = "taskPayload",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "任务数据，以 JSON 格式存储，方便存储不同类型和数量的参数"
    }
  ]; // 任务数据，以 JSON 格式存储，方便存储不同类型和数量的参数

  optional string cron_spec = 5 [
    json_name = "cronSpec",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "cron表达式，用于定义任务的调度时间"
    }
  ]; // cron表达式

  optional TaskOption task_options = 6 [
    json_name = "taskOptions",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "任务选项，以 JSON 格式存储，方便存储不同类型和数量的选项"
    }
  ]; // 任务选项

  optional string name = 7 [
    json_name = "name",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "任务显示名（人类可读，如 \"每日令牌清理\"；留空时前端回退显示 typeName）"
    }
  ]; // 任务显示名（人类可读，如 "每日令牌清理"；留空时前端回退显示 typeName）

  optional bool enable = 10 [
    json_name = "enable",
    (gnostic.openapi.v3.property) = {
      description: "启用/禁用任务"
    }
  ]; // 启用/禁用任务

  optional string remark = 11 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {
      description: "备注"
    }
  ]; // 备注

  optional bool builtin = 12 [
    json_name = "builtin",
    (gnostic.openapi.v3.property) = {
      description: "是否内置任务（由后端按内置名单计算填充，不落库；内置任务禁止删除）"
    }
  ]; // 是否内置任务（由后端按内置名单计算填充，不落库；内置任务禁止删除）

  optional TaskExecution last_execution = 13 [
    json_name = "lastExecution",
    (gnostic.openapi.v3.property) = {
      description: "最近一次执行记录（列表查询时由后端聚合填充，不落库）"
    }
  ]; // 最近一次执行记录（列表查询时由后端聚合填充，不落库）

  optional uint32 create_by = 100 [json_name = "createBy", (gnostic.openapi.v3.property) = {description: "创建者ID"}]; // 创建者ID
  optional uint32 update_by = 101 [json_name = "updateBy", (gnostic.openapi.v3.property) = {description: "更新者ID"}]; // 更新者ID

  optional google.protobuf.Timestamp create_time = 200 [json_name = "createTime", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp update_time = 201 [json_name = "updateTime", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp delete_time = 202 [json_name = "deleteTime", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 查询调度任务列表 - 回应
message ListTaskResponse {
  repeated Task items = 1;
  uint32 total = 2;
}

// 查询调度任务详情 - 请求
message GetTaskRequest {
  uint32 id = 1;
}
message GetTaskByTypeNameRequest {
  string type_name = 1 [
    json_name = "typeName",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "任务执行类型名，例如 \"send_email\"、\"generate_report\" 等，用于区分不同类型的任务"
    }
  ]; // 任务执行类型名
}

// 创建调度任务 - 请求
message CreateTaskRequest {
  Task data = 1;
}

// 更新调度任务 - 请求
message UpdateTaskRequest {
  Task data = 1;

  google.protobuf.FieldMask update_mask = 2 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,realname,username"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 3 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。

  uint32 id = 4 [json_name = "id", (gnostic.openapi.v3.property) = {description: "要更新的任务ID（URL 路径参数）"}]; // 要更新的任务ID
}

// 删除调度任务 - 请求
message DeleteTaskRequest {
  uint32 id = 1;
}

// 重启调度任务 - 回应
message RestartAllTaskResponse {
  int32 count = 1;
}

// 任务处理器信息
message TaskHandlerInfo {
  optional string type_name = 1 [
    json_name = "typeName",
    (gnostic.openapi.v3.property) = { description: "任务类型名（asynq 按此路由到处理器）" }
  ]; // 任务类型名

  optional string description = 2 [
    json_name = "description",
    (gnostic.openapi.v3.property) = { description: "处理器用途说明" }
  ]; // 处理器用途说明

  optional string payload_description = 3 [
    json_name = "payloadDescription",
    (gnostic.openapi.v3.property) = { description: "载荷参数填写规则说明（无参数时为 \"无需参数\" 类说明）" }
  ]; // 载荷参数填写规则说明

  optional string payload_example = 4 [
    json_name = "payloadExample",
    (gnostic.openapi.v3.property) = { description: "载荷示例（JSON，可直接填入；无参数时为 {}）" }
  ]; // 载荷示例（JSON，可直接填入）
}

// 任务执行状态
enum TaskExecutionStatus {
  ExecutionStatus_Unknown = 0; // 未知
  ExecutionStatus_Success = 1; // 成功
  ExecutionStatus_Failed = 2;  // 失败
}

// 任务执行记录
message TaskExecution {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = { description: "执行记录ID" }
  ]; // 执行记录ID

  optional uint32 task_id = 2 [
    json_name = "taskId",
    (gnostic.openapi.v3.property) = { description: "关联任务ID（sys_tasks.id；任务删除后记录保留）" }
  ]; // 关联任务ID

  optional string type_name = 3 [
    json_name = "typeName",
    (gnostic.openapi.v3.property) = { description: "任务类型名（冗余存储，任务删除后仍可辨识）" }
  ]; // 任务类型名

  optional TaskExecutionStatus status = 4 [
    json_name = "status",
    (gnostic.openapi.v3.property) = { description: "执行状态" }
  ]; // 执行状态

  optional string error = 5 [
    json_name = "error",
    (gnostic.openapi.v3.property) = { description: "失败原因" }
  ]; // 失败原因

  optional google.protobuf.Timestamp started_at = 6 [
    json_name = "startedAt",
    (gnostic.openapi.v3.property) = { description: "开始时间" }
  ]; // 开始时间

  optional google.protobuf.Timestamp finished_at = 7 [
    json_name = "finishedAt",
    (gnostic.openapi.v3.property) = { description: "结束时间" }
  ]; // 结束时间

  optional uint64 duration_ms = 8 [
    json_name = "durationMs",
    (gnostic.openapi.v3.property) = { description: "耗时（毫秒）" }
  ]; // 耗时（毫秒）

  optional google.protobuf.Timestamp create_time = 200 [json_name = "createTime", (gnostic.openapi.v3.property) = {description: "记录创建时间"}]; // 记录创建时间
}

// 查询任务执行记录 - 回应
message ListTaskExecutionsResponse {
  repeated TaskExecution items = 1;
  uint32 total = 2;
}

// 立即执行一次任务 - 请求
message RunTaskRequest {
  uint32 id = 1 [json_name = "id", (gnostic.openapi.v3.property) = {description: "任务ID（URL 路径参数）"}]; // 任务ID
}

// 查询已注册任务处理器清单 - 回应
message ListTaskHandlersResponse {
  repeated TaskHandlerInfo items = 1;
}

// 调度任务控制类型
enum TaskControlType {
  ControlType_Start = 0; // 启动
  ControlType_Stop = 1;  // 停止
  ControlType_Restart = 2; // 重启
}

// 控制调度任务 - 请求
message ControlTaskRequest {
  TaskControlType control_type = 1;

  string type_name = 2 [
    json_name = "typeName",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "任务执行类型名，例如 \"send_email\"、\"generate_report\" 等，用于区分不同类型的任务"
    }
  ]; // 任务执行类型名
}
