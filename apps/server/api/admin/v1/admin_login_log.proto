syntax = "proto3";

package admin.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

import "google/protobuf/timestamp.proto";

import "pagination/v1/pagination.proto";


// 后台登录日志管理服务
service AdminLoginLogService {
  // 查询后台登录日志列表
  rpc List (pagination.PagingRequest) returns (ListAdminLoginLogResponse) {
    option (google.api.http) = {
      get: "/api/v1/monitor/admin_login_logs"
    };
  }

  // 查询后台登录日志详情
  rpc Get (GetAdminLoginLogRequest) returns (AdminLoginLog) {
    option (google.api.http) = {
      get: "/api/v1/monitor/admin_login_logs/{id}"
    };
  }

  // 清理后台登录日志（保留最近 N 天，物理删除更早记录）
  rpc Clean (CleanAdminLoginLogRequest) returns (CleanAdminLoginLogResponse) {
    option (google.api.http) = {
      post: "/api/v1/monitor/admin_login_logs/clean"
      body: "*"
    };
  }
}

// 后台登录日志
message AdminLoginLog {
  optional uint32 id = 1 [
    json_name = "id",
    (google.api.field_behavior) = OPTIONAL,
    (gnostic.openapi.v3.property) = {
      description: "后台登录日志ID"
    }
  ]; // 后台登录日志ID

  optional string login_ip = 2 [
    json_name = "loginIp",
    (gnostic.openapi.v3.property) = {
      description: "登录IP地址"
    }
  ]; // 登录IP地址

  optional google.protobuf.Timestamp login_time = 4 [
    json_name = "loginTime",
    (gnostic.openapi.v3.property) = {
      description: "登录时间"
    }
  ]; // 登录时间

  optional int32 status_code = 5 [
    json_name = "statusCode",
    (gnostic.openapi.v3.property) = {
      description: "状态码"
    }
  ]; // 状态码

  optional bool success = 6 [
    json_name = "success",
    (gnostic.openapi.v3.property) = {
      description: "登录是否成功"
    }
  ]; // 登录是否成功

  optional string reason = 7 [
    json_name = "reason",
    (gnostic.openapi.v3.property) = {
      description: "登录失败原因"
    }
  ]; // 登录失败原因

  optional string location = 8 [
    json_name = "location",
    (gnostic.openapi.v3.property) = {
      description: "登录地理位置"
    }
  ]; // 登录地理位置

  optional string user_agent = 100 [
    json_name = "userAgent",
    (gnostic.openapi.v3.property) = {
      description: "浏览器的用户代理信息"
    }
  ]; // 浏览器的用户代理信息

  optional string browser_name = 101 [
    json_name = "browserName",
    (gnostic.openapi.v3.property) = {
      description: "浏览器名称"
    }
  ]; // 浏览器名称

  optional string browser_version = 102 [
    json_name = "browserVersion",
    (gnostic.openapi.v3.property) = {
      description: "浏览器版本"
    }
  ]; // 浏览器版本

  optional string client_id = 200 [
    json_name = "clientId",
    (gnostic.openapi.v3.property) = {
      description: "客户端ID"
    }
  ]; // 客户端ID

  optional string client_name = 201 [
    json_name = "clientName",
    (gnostic.openapi.v3.property) = {
      description: "客户端名称"
    }
  ]; // 客户端名称

  optional string os_name = 202 [
    json_name = "osName",
    (gnostic.openapi.v3.property) = {
      description: "操作系统名称"
    }
  ]; // 操作系统名称

  optional string os_version = 203 [
    json_name = "osVersion",
    (gnostic.openapi.v3.property) = {
      description: "操作系统版本"
    }
  ]; // 操作系统版本

  optional uint32 user_id = 300 [
    json_name = "userId",
    (gnostic.openapi.v3.property) = {
      description: "操作者用户ID"
    }
  ]; // 操作者用户ID

  optional string username = 301 [
    json_name = "username",
    (gnostic.openapi.v3.property) = {
      description: "操作者账号名"
    }
  ]; // 操作者账号名

  optional google.protobuf.Timestamp create_time = 400 [json_name = "createTime", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
}

// 查询后台登录日志列表 - 回应
message ListAdminLoginLogResponse {
  repeated AdminLoginLog items = 1;
  uint32 total = 2;
}

// 查询后台登录日志详情 - 请求
message GetAdminLoginLogRequest {
  uint32 id = 1;
}

// 创建后台登录日志 - 请求
message CreateAdminLoginLogRequest {
  AdminLoginLog data = 1;
}

// 清理后台登录日志 - 请求
message CleanAdminLoginLogRequest {
  uint32 keep_days = 1 [
    json_name = "keepDays",
    (gnostic.openapi.v3.property) = {
      description: "保留最近天数（1~3650），create_time 早于该截止点的记录将被物理删除"
    }
  ]; // 保留最近天数（1~3650）
}

// 清理后台登录日志 - 回应
message CleanAdminLoginLogResponse {
  uint32 deleted = 1 [
    json_name = "deleted",
    (gnostic.openapi.v3.property) = {
      description: "实际删除行数"
    }
  ]; // 实际删除行数
}
