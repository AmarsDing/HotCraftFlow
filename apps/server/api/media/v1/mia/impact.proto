syntax = "proto3";

package media.mia.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// ============================================================================
// ③ MIA 市场影响分析的对外契约（契约 §3）。默认不对外发布（PRD §12 Q2）。
// 枚举用 string（服务层校验），字段显式 json_name = snake_case。
// ============================================================================

// ImpactCard 是 MIA 的输出契约。disclaimer 强制非空（空卡不允许落库）。
message ImpactCard {
  string api_version = 1 [json_name = "api_version"];
  string impact_id = 2 [json_name = "impact_id"]; // im_ 前缀
  string topic_id = 3 [json_name = "topic_id"];
  ImpactEvent event = 4 [json_name = "event"];
  Sentiment sentiment = 5 [json_name = "sentiment"];
  Impact impact = 6 [json_name = "impact"];
  repeated AffectedItem affected = 7 [json_name = "affected"];
  string disclaimer = 8 [json_name = "disclaimer"]; // 强制非空
  Verified verified = 9 [json_name = "verified"];
}

message ImpactEvent {
  string title = 1 [json_name = "title"];
  string summary = 2 [json_name = "summary"];
  repeated string sources = 3 [json_name = "sources"]; // IntelItem id 列表
  google.protobuf.Timestamp occurred_at = 4 [json_name = "occurred_at"]; // UTC
}

message Sentiment {
  string label = 1 [json_name = "label"];   // positive|neutral|negative|unknown
  double score = 2 [json_name = "score"];   // -1 ~ 1；unknown 时为 0（不猜）
  string engine = 3 [json_name = "engine"]; // finbert | llm | none（不同引擎分数不可混比）
  string lang = 4 [json_name = "lang"];
}

message Impact {
  double score = 1 [json_name = "score"];    // 0–100
  int32 ttl_hours = 2 [json_name = "ttl_hours"]; // 6–24；过期卡不得占据排行榜
  ImpactFactors factors = 3 [json_name = "factors"];
}

message ImpactFactors {
  double sentiment = 1 [json_name = "sentiment"];
  double source_weight = 2 [json_name = "source_weight"];
  double relevance = 3 [json_name = "relevance"];
  double decay = 4 [json_name = "decay"];
}

// AffectedItem：每条结论必须有 path（无 path 视为违约）；传导项 confidence ≤0.6。
message AffectedItem {
  string symbol = 1 [json_name = "symbol"];       // SPY / ^GSPC / EURUSD / BTC/USDT
  string asset_class = 2 [json_name = "asset_class"]; // equity|index|fx|commodity|crypto
  string direction = 3 [json_name = "direction"];     // bullish|bearish|neutral
  double confidence = 4 [json_name = "confidence"];
  repeated string path = 5 [json_name = "path"]; // 影响路径文本链
  string rule_id = 6 [json_name = "rule_id"];
  bool is_transmission = 7 [json_name = "is_transmission"];
}

message Verified {
  google.protobuf.Timestamp checked_at = 1 [json_name = "checked_at"];
  double actual_move = 2 [json_name = "actual_move"];
  bool hit = 3 [json_name = "hit"];
}

// TransmissionRule 跨资产传导规则（confidence 强制 ≤0.6，假设不是因果）。
message TransmissionRule {
  string rule_id = 1 [json_name = "rule_id"]; // rule_ 前缀
  TriggerSpec trigger = 2 [json_name = "trigger"];
  string to_asset = 3 [json_name = "to_asset"];
  string to_direction = 4 [json_name = "to_direction"];
  double confidence = 5 [json_name = "confidence"]; // (0, 0.6]
  string note = 6 [json_name = "note"]; // 必填
}

message TriggerSpec {
  string asset = 1 [json_name = "asset"];
  string direction = 2 [json_name = "direction"];
  double min_move_pct = 3 [json_name = "min_move_pct"];
}

// ============================================================================
// REST 服务定义（FR-MIA-06/07/08/11/12 的管理与查询面）。
// ============================================================================

// ImpactCardListItem 影响卡列表视图（摘要字段，详情走 GetImpactCard）。
message ImpactCardListItem {
  string impact_id = 1 [json_name = "impact_id"];
  string event_id = 2 [json_name = "event_id"];
  string title = 3 [json_name = "title"];
  string sentiment_label = 4 [json_name = "sentiment_label"];
  double sentiment_score = 5 [json_name = "sentiment_score"];
  string sentiment_engine = 6 [json_name = "sentiment_engine"];
  double impact_score = 7 [json_name = "impact_score"];
  string direction = 8 [json_name = "direction"];
  int32 ttl_hours = 9 [json_name = "ttl_hours"];
  string expires_at = 10 [json_name = "expires_at"]; // RFC3339 UTC
  string occurred_at = 11 [json_name = "occurred_at"];
  string created_at = 12 [json_name = "created_at"];
  int32 affected_count = 13 [json_name = "affected_count"];
  bool pushed = 14 [json_name = "pushed"];
  bool no_mapping = 15 [json_name = "no_mapping"];
}

message ListImpactCardsRequest {
  int32 page = 1 [json_name = "page"];
  int32 page_size = 2 [json_name = "page_size"];
  string direction = 3 [json_name = "direction"];       // bullish|bearish|neutral
  double min_score = 4 [json_name = "min_score"];
  bool include_expired = 5 [json_name = "include_expired"]; // 默认只看未过期（TTL 纪律）
  string occurred_after = 6 [json_name = "occurred_after"];
}

message ListImpactCardsResponse {
  repeated ImpactCardListItem items = 1 [json_name = "items"];
  int32 total = 2 [json_name = "total"];
}

message GetImpactCardRequest {
  string impact_id = 1 [json_name = "impact_id"];
}

// GetImpactCardResponse 详情：完整契约卡 + 存储侧附加字段。
message GetImpactCardResponse {
  ImpactCard card = 1 [json_name = "card"];
  string impact_id = 2 [json_name = "impact_id"];
  string event_id = 3 [json_name = "event_id"];
  string expires_at = 4 [json_name = "expires_at"];
  string created_at = 5 [json_name = "created_at"];
  bool pushed = 6 [json_name = "pushed"];
  bool no_mapping = 7 [json_name = "no_mapping"];
  string rule_version = 8 [json_name = "rule_version"];
}

// CalibrationBucket 按规则的校准统计桶（FR-MIA-11，P2）。
message CalibrationBucket {
  string rule_id = 1 [json_name = "rule_id"];
  int32 samples = 2 [json_name = "samples"];
  double hit_rate = 3 [json_name = "hit_rate"];
}

message GetCalibrationRequest {
  string since = 1 [json_name = "since"];
  string until = 2 [json_name = "until"];
}

// CalibrationReport 校准报告。固定提示：校准参考，非预测准确率承诺。
message CalibrationReport {
  repeated CalibrationBucket buckets = 1 [json_name = "buckets"];
  int32 total_samples = 2 [json_name = "total_samples"];
  string window = 3 [json_name = "window"];
  string note = 4 [json_name = "note"];
  bool enabled = 5 [json_name = "enabled"]; // verify.enabled=false 时返回空报告
}

// TransmissionRuleItem 传导规则列表视图（FR-MIA-08：每条带 confidence 与 note）。
message TransmissionRuleItem {
  int64 id = 1 [json_name = "id"];
  TransmissionRule rule = 2 [json_name = "rule"];
  bool enabled = 3 [json_name = "enabled"];
  int32 hit_count = 4 [json_name = "hit_count"];
  int32 correct_count = 5 [json_name = "correct_count"];
}

message ListTransmissionRulesRequest {
  bool enabled_only = 1 [json_name = "enabled_only"];
}

message ListTransmissionRulesResponse {
  repeated TransmissionRuleItem items = 1 [json_name = "items"];
}

// GetQuoteRequest 行情只读查询。
// symbol 走 query（BTC/USDT 含斜杠，不能用路径参数）。
message GetQuoteRequest {
  string symbol = 1 [json_name = "symbol"];
}

message OhlcvBar {
  string t = 1 [json_name = "t"]; // bucket 时间 RFC3339
  double open = 2 [json_name = "open"];
  double high = 3 [json_name = "high"];
  double low = 4 [json_name = "low"];
  double close = 5 [json_name = "close"];
  double volume = 6 [json_name = "volume"];
}

message GetQuoteResponse {
  string symbol = 1 [json_name = "symbol"];
  string provider = 2 [json_name = "provider"];
  repeated OhlcvBar bars = 3 [json_name = "bars"];
  string fetched_at = 4 [json_name = "fetched_at"];
  bool from_cache = 5 [json_name = "from_cache"];
}

// ImpactService 影响卡查询、校准报告、传导规则、行情只读查询。
service ImpactService {
  rpc ListImpactCards(ListImpactCardsRequest) returns (ListImpactCardsResponse) {
    option (google.api.http) = { get: "/api/v1/media/mia/impacts" };
  }
  rpc GetImpactCard(GetImpactCardRequest) returns (GetImpactCardResponse) {
    option (google.api.http) = { get: "/api/v1/media/mia/impact/{impact_id}" };
  }
  rpc GetCalibration(GetCalibrationRequest) returns (CalibrationReport) {
    option (google.api.http) = { get: "/api/v1/media/mia/calibration" };
  }
  rpc ListTransmissionRules(ListTransmissionRulesRequest) returns (ListTransmissionRulesResponse) {
    option (google.api.http) = { get: "/api/v1/media/mia/rules" };
  }
  rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse) {
    option (google.api.http) = { get: "/api/v1/media/mia/quotes" };
  }
}
