syntax = "proto3";

package media.ic.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// ============================================================================
// IntelItem —— ① IC 情报收集的输出契约（契约 §1）。
// 消费者：② TT（全量）、③ MIA（仅 C_market）、④ MME（仅 B_material）。
//
// 约定（评审 B-3/B-4 修复）：
//  - 枚举字段一律用 string（禁用 proto enum，否则 protojson 序列化为
//    COLLECT_METHOD_HOTLIST 而非契约要求的小写 hotlist）。合法值由服务层校验。
//  - 所有字段显式 json_name = snake_case，保证 protojson 与 encoding/json
//    两条路径输出一致（契约强制 snake_case）。
//  - 时间一律 google.protobuf.Timestamp，存储与序列化均为 UTC 带 Z。
// ============================================================================

message IntelItem {
  string api_version = 1 [json_name = "api_version"]; // 恒 "1.0"
  string intel_id    = 2 [json_name = "intel_id"];    // it_ 前缀
  IntelItemSource source   = 3 [json_name = "source"];
  IntelPayload    payload  = 4 [json_name = "payload"];
  repeated IntelEntity entities = 5 [json_name = "entities"];
  // category ∈ {A_hot, B_material, C_market, D_compliance}（服务层校验）
  string category = 6 [json_name = "category"];
  IntelMetrics     metrics     = 7 [json_name = "metrics"];
  IntelDedup       dedup       = 8 [json_name = "dedup"];
  IntelCompliance  compliance  = 9 [json_name = "compliance"];
  IntelWorkability workability = 10 [json_name = "workability"];
}

message IntelItemSource {
  string platform = 1 [json_name = "platform"]; // 见契约 §1 平台枚举表
  string region   = 2 [json_name = "region"];   // cn | intl | global
  // collect_method ∈ {hotlist, api, rss, crawl, sidecar}（服务层校验）
  string collect_method = 3 [json_name = "collect_method"];
  string url    = 4 [json_name = "url"];
  string author = 5 [json_name = "author"]; // 仅存公开昵称（PIPL）
  google.protobuf.Timestamp collected_at = 6 [json_name = "collected_at"]; // 本地接收时间 UTC，必填
  google.protobuf.Timestamp published_at = 7 [json_name = "published_at"]; // 上游发布时间 UTC，可空（评审 C-9 补登）
  IntelEvidence evidence = 8 [json_name = "evidence"];
}

message IntelEvidence {
  string snapshot_path = 1 [json_name = "snapshot_path"];
  string raw_ref       = 2 [json_name = "raw_ref"];
  map<string, string> http_headers = 3 [json_name = "http_headers"]; // 脱敏后的受限集合
}

message IntelPayload {
  string title = 1 [json_name = "title"];
  string text  = 2 [json_name = "text"];
  repeated string media_refs = 3 [json_name = "media_refs"]; // asset:// 可加工；https:// 须先下载
  string lang = 4 [json_name = "lang"]; // BCP-47，und 兜底
}

message IntelEntity {
  // type ∈ {person, org, policy, tech, place, topic}（服务层校验）
  string type       = 1 [json_name = "type"];
  string value      = 2 [json_name = "value"];
  double confidence = 3 [json_name = "confidence"]; // [0,1]；<0.6 不进 MIA
}

message IntelMetrics {
  int32 rank       = 1 [json_name = "rank"];       // 无榜 = 0
  int32 rank_total = 2 [json_name = "rank_total"]; // 无榜 = 0（0 与 null 语义不同）
  int64 views      = 3 [json_name = "views"];
  int64 likes      = 4 [json_name = "likes"];
  int64 comments   = 5 [json_name = "comments"];
  // 契约字段名为 _as_of（指标快照时间）。
  google.protobuf.Timestamp as_of = 6 [json_name = "_as_of"];
}

message IntelDedup {
  string url_key     = 1 [json_name = "url_key"];
  string fingerprint = 2 [json_name = "fingerprint"]; // SimHash 16 位小写 hex（string，非 uint64）
  string cluster_id  = 3 [json_name = "cluster_id"];  // cl_ 前缀（评审修正：初版误写 tp_）
}

message IntelCompliance {
  string gate = 1 [json_name = "gate"]; // pass | review | block（服务层校验）
  repeated string reasons = 2 [json_name = "reasons"];
}

message IntelWorkability {
  double score  = 1 [json_name = "score"];
  string reason = 2 [json_name = "reason"];
}

// ============================================================================
// 情报检索 / 详情 / 证据导出 / 手贴续跑 / 簇操作（文档 01-IC/02 §6.2、评审 B-13/S-23）。
// ============================================================================

message ListIntelsRequest {
  int32  page = 1 [json_name = "page"];
  int32  page_size = 2 [json_name = "page_size"];
  string platform = 3 [json_name = "platform"];
  string region = 4 [json_name = "region"];
  string category = 5 [json_name = "category"];   // A_hot | B_material | C_market | D_compliance
  string cluster_id = 6 [json_name = "cluster_id"];
  string collect_method = 7 [json_name = "collect_method"];
  // FR-INT-14：全文检索（V1 降级 ILIKE，评审 B-19）+ 实体值过滤 + 时间范围（UTC RFC3339）
  string keyword = 8 [json_name = "keyword"];
  string entity = 9 [json_name = "entity"];
  google.protobuf.Timestamp collected_from = 10 [json_name = "collected_from"];
  google.protobuf.Timestamp collected_to = 11 [json_name = "collected_to"];
  // 合规复核队列过滤：gate = pass | review | block
  string gate = 12 [json_name = "gate"];
}

message ListIntelsResponse {
  repeated IntelItem items = 1 [json_name = "items"];
  int32 total = 2 [json_name = "total"];
}

message GetIntelRequest { string id = 1 [json_name = "id"]; }

// SupplementIntelRequest 手贴正文续跑（FR-INT-04 降级路径）。
// 评审 C-12：手贴不新建 IntelItem，而是对既有条目 UPDATE payload.text。
message SupplementIntelRequest {
  string id = 1 [json_name = "id"];
  string text = 2 [json_name = "text"];
}
message SupplementIntelResponse { bool ok = 1 [json_name = "ok"]; }

// EvidenceExport 证据包元数据（ZIP 字节流走独立下载 handler，03 §6）。
message EvidenceExport {
  string intel_id = 1 [json_name = "intel_id"];
  string evidence_id = 2 [json_name = "evidence_id"];
  string download_url = 3 [json_name = "download_url"];
  string chain_hash = 4 [json_name = "chain_hash"];
  string prev_hash  = 5 [json_name = "prev_hash"];
  string raw_hash   = 6 [json_name = "raw_hash"];
}
message ExportEvidenceRequest {
  string id = 1 [json_name = "id"];
  string operator = 2 [json_name = "operator"]; // 导出审计（评审 M-19，必填）
}

// ---------- 簇管理（S-23） ----------

message IntelCluster {
  string id = 1 [json_name = "id"]; // cl_ 前缀
  string label = 2 [json_name = "label"];
  int32 member_count = 3 [json_name = "member_count"];
  int32 platform_count = 4 [json_name = "platform_count"];
  string representative_id = 5 [json_name = "representative_id"];
  string region = 6 [json_name = "region"];
  string merged_by = 7 [json_name = "merged_by"]; // url | fingerprint | embedding | manual
  string status = 8 [json_name = "status"];       // open | closed
  google.protobuf.Timestamp first_seen_at = 9 [json_name = "first_seen_at"];
  google.protobuf.Timestamp last_seen_at = 10 [json_name = "last_seen_at"];
}

message ListClustersRequest {
  int32  page = 1 [json_name = "page"];
  int32  page_size = 2 [json_name = "page_size"];
  string region = 3 [json_name = "region"];
  string status = 4 [json_name = "status"];
}
message ListClustersResponse {
  repeated IntelCluster items = 1 [json_name = "items"];
  int32 total = 2 [json_name = "total"];
}

message SplitClusterRequest {
  string id = 1 [json_name = "id"];
  repeated string intel_ids = 2 [json_name = "intel_ids"]; // 要劈出的条目
  string operator = 3 [json_name = "operator"];
}
message SplitClusterResponse { string new_cluster_id = 1 [json_name = "new_cluster_id"]; }

message MergeClusterRequest {
  repeated string from_cluster_ids = 1 [json_name = "from_cluster_ids"];
  string to_cluster_id = 2 [json_name = "to_cluster_id"];
  string reason = 3 [json_name = "reason"];
  string operator = 4 [json_name = "operator"];
}
message MergeClusterResponse { bool ok = 1 [json_name = "ok"]; }

// IntelService 情报查询与治理操作。
service IntelService {
  rpc ListIntels(ListIntelsRequest) returns (ListIntelsResponse) {
    option (google.api.http) = { get: "/api/v1/media/ic/intels" };
  }
  rpc GetIntel(GetIntelRequest) returns (IntelItem) {
    option (google.api.http) = { get: "/api/v1/media/ic/intels/{id}" };
  }
  rpc SupplementIntel(SupplementIntelRequest) returns (SupplementIntelResponse) {
    option (google.api.http) = { post: "/api/v1/media/ic/intels/{id}/supplement" body: "*" };
  }
  rpc ExportEvidence(ExportEvidenceRequest) returns (EvidenceExport) {
    option (google.api.http) = { get: "/api/v1/media/ic/intels/{id}/evidence" };
  }
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse) {
    option (google.api.http) = { get: "/api/v1/media/ic/clusters" };
  }
  rpc SplitCluster(SplitClusterRequest) returns (SplitClusterResponse) {
    option (google.api.http) = { post: "/api/v1/media/ic/clusters/{id}/split" body: "*" };
  }
  rpc MergeCluster(MergeClusterRequest) returns (MergeClusterResponse) {
    option (google.api.http) = { post: "/api/v1/media/ic/clusters/merge" body: "*" };
  }
}
